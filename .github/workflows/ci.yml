name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Dependabot PRs are checked by .github/workflows/dependabot.yml
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck und Build
        run: npm run build
      - name: Sicherheitslücken in Laufzeit-Abhängigkeiten
        run: npm audit --omit=dev --audit-level=high
