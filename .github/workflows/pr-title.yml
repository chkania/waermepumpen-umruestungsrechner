name: PR-Titel

# Der PR-Titel wird beim Squash-Merge zur Commit-Nachricht auf main und bestimmt damit die Version (N9).
# Format nach Conventional Commits: <typ>[(bereich)][!]: <beschreibung>, z. B. „feat: Vergleich mit PV-Anlage“.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Titel prüfen
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release.ts --lint "$TITLE" | tee -a "$GITHUB_STEP_SUMMARY"
