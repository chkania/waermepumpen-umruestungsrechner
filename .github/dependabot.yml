# Dependabot: weekly updates for npm packages and GitHub Actions.
# The workflow .github/workflows/dependabot.yml checks every Dependabot PR (tests, build,
# THIRD-PARTY-NOTICES.md) and merges patch/minor updates automatically.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    # Adopt new versions only after a few days (protection against compromised releases)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Conventional Commits (N9): "chore(deps): …" or "chore(deps-dev): …" → no new app version
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    groups:
      # Patch/minor updates grouped; major updates arrive individually for manual review
      laufzeit:
        dependency-type: production
        update-types: [minor, patch]
      entwicklung:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions:
        patterns: ["*"]
