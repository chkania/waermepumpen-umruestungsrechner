<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wirtschaftlichkeitsrechner für den Umstieg von Gas- oder Ölheizung auf eine Wärmepumpe – mit Energiepreisentwicklung, KfW-Förderung, Kredit und Steuerbonus." />
    <title>Wärmepumpen-Rechner</title>
    <script>
      // Design und Hell/Dunkel vor dem ersten Zeichnen setzen (kein Aufblitzen)
      (function () {
        var d = null, t = null;
        try {
          d = localStorage.getItem('wp-investitionsrechner:design');
          t = localStorage.getItem('wp-investitionsrechner:theme');
        } catch (e) {}
        var html = document.documentElement;
        html.dataset.design = d === 'classic' ? 'classic' : 'modern';
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        html.dataset.theme = t === 'light' || t === 'dark' ? t : dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M9 22V12l7-5 7 5v10z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M13 17h6' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
